server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and is the only thing that talks to this container.
    # Trusting its forwarded headers is what lets logs show the real client.
    #
    # **`real_ip_recursive on` is what makes that sentence true.** Without it
    # nginx takes the *last* entry of X-Forwarded-For and stops, and the last
    # entry is the Cloudflare edge — so every log line recorded an edge address
    # as the client while the header sitting beside it held the real one:
    #
    #   172.71.172.80 - - [02/Aug/2026:11:49:14] "GET / HTTP/1.1" 200
    #     "82.27.107.63, 172.71.172.80"
    #
    # With it, nginx walks the list right to left past every address it trusts
    # and lands on the leftmost — the caller. Only worth doing since
    # kolonie-infra#56, which made Traefik keep the incoming header instead of
    # replacing it; before that the list had one entry and there was nothing to
    # walk.
    #
    # **`set_real_ip_from 0.0.0.0/0` means the leftmost entry is believed,
    # whoever wrote it.** That is safe exactly while the origin refuses traffic
    # that did not come through Cloudflare — kolonie-infra#21, and the same
    # condition kolonie-infra#56 rests on. If that stops holding, anyone who
    # reaches the origin directly can put any address in this log, and these
    # three lines come out together.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;
    real_ip_recursive on;

    # Astro emits directory-style URLs. Try the path, then the directory, then
    # the `.html` beside it.
    #
    # **`=404` and not `/404.html`, and the difference is the status code.** A
    # file as the last argument of `try_files` is *served*, so nginx answered
    # every missing URL with the site's 404 page under HTTP 200 — a soft 404.
    # Measured on 2026-07-30: `kolonie.ai/definitely-not-a-page/` returned `200`.
    # A crawler indexes those as real pages and a broken link reads as a working
    # one, which is the more expensive half.
    #
    # `=404` raises the status instead, and `error_page` below renders the same
    # page for it — so the reader still gets the site's 404 and never nginx's,
    # which is what the previous version of this comment was protecting.
    #
    # **That page is `src/pages/404.astro` since kolonie-website#95.** Starlight
    # generated `dist/404.html` and nothing else did, so removing the framework
    # would have pointed these two directives at a file the build stopped
    # producing — nginx's own error page, on every wrong URL. The route was
    # added in the same commit for that reason.
    # **`$uri/index.html` before `$uri/`, and the difference is a redirect.**
    # With `$uri/` first, nginx serves the directory index through the index
    # module, which answers a request without a trailing slash with a `301` to
    # one. Measured 2026-08-03 against this image: `/skill` returned `301` and
    # `/skill/` returned `200`. Harmless for a browser and not harmless for
    # `/skill`, which is a URL a human pastes into an agent — some fetchers do
    # not follow redirects, and the one page written to be read by a machine is
    # the wrong place to require it (kolonie-website#8).
    #
    # Trying the index file directly serves it under the URL as asked, so both
    # spellings answer `200` and neither is a redirect to the other.
    # `/sponsors` moved to `/quests` (kolonie-website#55), and the old addresses
    # keep answering permanently rather than 404ing.
    #
    # **These are not optional and the reason is not tidiness.** `/sponsors` is
    # linked from `/llms.txt`, from the `.well-known` descriptors (`#46`), from
    # `governance/terms.md` — which quotes it as where the price is named — and
    # from anywhere outside we cannot see. A 404 there breaks a legal document's
    # cross-reference.
    #
    # **`301` and not Astro's `redirects`, and the difference is the status
    # code.** A static Astro redirect emits an HTML page carrying a meta refresh,
    # served `200`. That is a page that says *this moved* to a browser and says
    # *this is the content* to everything else — a crawler keeps the old URL
    # indexed and a fetcher that does not execute markup gets an empty document.
    # `return 301` is the answer the protocol has for this.
    #
    # Exact matches, so they take priority over `location /` below, and both
    # spellings — with and without the trailing slash — because the redirect has
    # to fire before the index module gets a chance to add one.
    location = /sponsors { return 301 /quests/; }
    location = /sponsors/ { return 301 /quests/; }
    location = /sponsors/ideas { return 301 /quests/ideas/; }
    location = /sponsors/ideas/ { return 301 /quests/ideas/; }

    # `/run-a-colony` → `/run-a-swarm` (kolonie-website#89). The page was named
    # after the confusion it is now fixed for: *colony* is the whole and *swarm*
    # is one operator's, and the old path said the second with the first word.
    #
    # It is in the footer of every page, in the sitemap, and linked from
    # `/one-swarm/` — and it may be linked from outside, which is the half
    # nobody can check. `#89`: *"A rename that 404s is worse than the wrong
    # word."*
    location = /run-a-colony { return 301 /run-a-swarm/; }
    location = /run-a-colony/ { return 301 /run-a-swarm/; }

    location / {
        try_files $uri $uri/index.html $uri/ $uri.html =404;
    }

    # The Colony writes em dashes and typographic quotes. Without this, a
    # `text/plain` response carries no encoding at all and the consumer guesses
    # — `/llms.txt` is the one that matters, and it is read by machines.
    charset utf-8;

    # Fingerprinted assets are safe to cache hard; HTML is not, because a deploy
    # must be visible immediately.
    #
    # **This block has no `try_files`, and that is what makes a miss here the one
    # 404 on this site that logs at error level.** `location /` ends its chain
    # with `=404`, which is a status and not a file, so nginx never opens
    # anything and writes nothing to the error log. A request under `/_astro/`
    # goes straight to the static handler instead, so a missing file is an
    # `open() ... failed (2: No such file or directory)` line — severity
    # `[error]`, which `kolonie-infra`'s promtail stage 5c turns into
    # `level=error`, which the Watch Agent counts.
    #
    # **Keep it that way.** A `/_astro/` URL is never typed by a human and never
    # guessed by a crawler: our own build emits it, hash and all. So a miss here
    # means one of two things, and both are worth waking up for — HTML cached
    # against a deploy that moved the hashes, which is a visitor looking at an
    # unstyled page, or somebody requesting a mangled version of a real asset.
    # `log_not_found off` would silence the second and the first with it, and the
    # first is the only way this site breaks without anything returning 5xx.
    #
    # **The false alarm it produces is cheap and was measured.**
    # `kolonie-docs#327`: 56 error lines on 2026-08-12 against a daily normal of
    # 0.29, all of them 43 different clients asking for three real assets with a
    # trailing `'` or `%27` on the end. Every file existed and still does; every
    # request was a 404 for a URL we never emitted. One issue, no outage.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # nginx's bundled `mime.types` has no entry for `.webmanifest`, so the file
    # `kolonie-website#62` added was served as `application/octet-stream`.
    # Measured against `kolonie.ai` on 2026-08-07, minutes after it went live.
    #
    # **A manifest served as a binary is a manifest that is not read.** Chrome
    # refuses one whose type is neither `application/manifest+json` nor a JSON
    # type, and logs the refusal to a console nobody watching a documentation
    # site will open — so the icons and the install name are silently absent
    # while the file answers `200` and looks correct in every check that only
    # asks for a status code.
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
