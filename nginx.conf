server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and is the only thing that talks to this container.
    # Trusting its forwarded headers is what lets logs show the real client.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    # Astro emits directory-style URLs. Try the path, then the directory, then
    # Starlight's own 404 — never nginx's, which would look like a broken server
    # rather than a missing page.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Fingerprinted assets are safe to cache hard; HTML is not, because a deploy
    # must be visible immediately.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
