version: 2

# Keep the dependencies current on a schedule instead of on the day something
# breaks. Nothing had been watching them: there was no `dependabot.yml` in this
# repository at all, so every bump was somebody noticing (kolonie-website#140).
#
# ## The one thing that shapes this whole file
#
# The organisation's sweep arms auto-merge on **every** open pull request that
# survives its seven filters. It is not scoped to an author and not to a branch
# prefix — that omission is deliberate and documented in
# `kolonie-docs/.github/scripts/opencode-worker.sh`, and it means a Dependabot
# pull request merges itself the moment the required checks go green, with
# nobody having read it.
#
# This repository will actually arm them: `main` requires the status check
# `check`, which is the non-empty required context the sweep looks for before it
# enables auto-merge. Dependabot pushes its branch inside this repository, so the
# fork filter does not exclude it either.
#
# For a patch or a minor that is the point, and `npm run check` — types, unit
# tests, the build, the built-output tests and the 390px viewport pass — is
# comprehensive enough to be the reader. For a major it is not: a green suite
# says the code compiles and the tests pass, not that a runtime contract
# survived. So npm majors are not opened at all (see the `ignore` below) rather
# than opened and hoped about.
#
# GitHub Actions majors are treated differently on purpose. A workflow change
# arrives in its own pull request's run, so a broken action is red before it can
# merge — the check checks itself. That is a property npm dependencies do not
# have at build time.

updates:
  - package-ecosystem: npm
    # One entry, and one ecosystem: a single `package-lock.json` at the root,
    # no workspaces.
    directory: /
    schedule:
      interval: weekly
      day: monday
      # Offset from everything else that talks to the API on a schedule: the
      # platform's own Dependabot entries at 05:20 and 05:40, and `readme.yml`
      # in this repository at 07:58.
      time: '05:30'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Routing only. Provenance is not claimed: the board reader derives `from:`
    # from the author, and a file that asserted it here would be asserting it
    # about a bot it does not speak for. The label has to exist — Dependabot
    # drops an unknown one silently and the pull request arrives unrouted
    # (`kolonie-platform#687`), which is what `src/lib/dependabot.test.ts`
    # checks.
    labels: ['area:website']
    groups:
      # Two groups rather than one, because the blast radius differs and a
      # single pull request would make them indistinguishable. Both are
      # patch-and-minor only; see `ignore`.
      production-dependencies:
        dependency-type: production
        update-types: ['minor', 'patch']
      development-dependencies:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      # Majors are withheld from the sweep by never existing. Deleting these
      # three lines turns them on, and whoever does that should read the note at
      # the top of this file first: it will also hand them to auto-merge, and an
      # Astro major landing unread on the public site is the outcome being
      # prevented.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:50'
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    labels: ['area:website']
    groups:
      # One pull request for the lot. The workflows here pin the same handful of
      # actions, so ungrouped this is several pull requests saying one thing.
      github-actions:
        patterns: ['*']
