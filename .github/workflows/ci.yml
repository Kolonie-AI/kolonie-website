name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The blog renders decision records that live in kolonie-docs, and no copy
      # of one exists in this repository (kolonie-website#15). Inside the tree
      # because the image build's Docker context is this directory and cannot
      # reach outside it; the same path is what `docsCheckout()` looks for.
      - uses: actions/checkout@v4
        with:
          repository: Kolonie-AI/kolonie-docs
          path: .kolonie-docs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # `npm run check` ends in the viewport suite, which loads every built page
      # in a real browser at 390px (kolonie-website#98). `npm run test:viewport`
      # installs Chromium itself, so this step is not what makes the suite work
      # — it is what supplies the **system libraries** Chromium needs, which
      # need `sudo` and so cannot live in a package script a stranger runs.
      #
      # The cache is what keeps it from being a download per run. The key is the
      # lockfile, because the browser build Playwright wants is pinned by the
      # Playwright version in it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      # astro check first: a type error should fail before a build that would
      # succeed anyway and hide it.
      - run: npm run check

      # A build that produces no pages is green and useless — Astro will happily
      # emit an empty site if the content collection is misconfigured. Assert the
      # landing page exists and carries its content.
      - name: Assert the site is not empty
        run: |
          test -f dist/index.html || { echo "::error::no index.html was built"; exit 1; }
          grep -q "Kolonie AI" dist/index.html || { echo "::error::index.html does not mention the Colony"; exit 1; }
          echo "dist/index.html: $(wc -c < dist/index.html) bytes"
