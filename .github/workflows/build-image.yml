name: Build image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/kolonie-ai/kolonie-website

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The blog is rendered from kolonie-docs at build time and this repository
      # holds no copy of a record (kolonie-website#15). It has to be *inside*
      # the context, because `COPY . .` in the Dockerfile is what carries it into
      # the build stage and Docker cannot reach above the context directory.
      # A build that cannot find it fails rather than shipping an empty blog.
      - uses: actions/checkout@v4
        with:
          repository: Kolonie-AI/kolonie-docs
          path: .kolonie-docs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One timestamp for the run. `github.event.repository.updated_at` is the
      # expression that looks right for `created` and is not: it is when the
      # repository record last changed, which is neither this build nor
      # necessarily this commit.
      - id: built-at
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The analytics site id, written into every page by `astro build`
          # (kolonie-website#43). A repository *variable* and deliberately not a
          # secret: it is served to every visitor in the tag, and a secret here
          # would only obscure it from the people maintaining the build. Unset,
          # the image ships with no analytics tag and every page still loads.
          build-args: |
            PUBLIC_UMAMI_WEBSITE_ID=${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Provenance, so the image can say which commit built it (#4).
          #
          # Without these, *which build is this container running* is answerable
          # only by listing GHCR versions and matching digests — registry access
          # rather than a shell, and the wrong shape of answer during a partial
          # deploy, when somebody has to find out per service what shipped.
          #
          # It is also what kolonie-infra#44's drift check reads. Until now this
          # service reported `unknown` on every run: honest, quiet, and not
          # covered — if the site fell a build behind, the check would have said
          # exactly what it said when everything was fine. This is the service
          # that failure has actually happened to (kolonie-infra#11).
          #
          # Same four labels and the same shape as kolonie-platform's three
          # builds, so the two repositories say the same thing the same way.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.built-at.outputs.iso }}
            org.opencontainers.image.version=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The step that was missing here, and that kolonie-platform's workflows have
  # had since kolonie-infra#14. Pushing the image was the end of this workflow,
  # so the site rebuilt on every commit and production kept serving whatever had
  # last been deployed for some other reason. Found by shipping /academy, seeing
  # the image build green, and then reading a 404 off kolonie.ai/academy/.
  #
  # The comment this replaces named the two prerequisites — package read access
  # for kolonie-infra, and `--profile website` in `detect_profile()`. Both are
  # done, so what was left was nobody calling the deploy.
  #
  # `version: github.sha` rather than `latest` for the same reason the platform
  # workflows pass it: deploying `latest` ships whatever finished building most
  # recently, which need not be this commit. Naming the tag this job just pushed
  # makes what runs a function of a commit again.
  deploy:
    name: deploy ghcr.io/kolonie-ai/kolonie-website:${{ github.sha }} to the VPS
    needs: build
    uses: Kolonie-AI/kolonie-infra/.github/workflows/deploy.yml@main
    with:
      service: website
      version: ${{ github.sha }}
    # Named, not inherited: the called workflow declares exactly these two.
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    permissions:
      contents: read
      packages: read
