name: Build image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/kolonie-ai/kolonie-website

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deploy host pulls this image with the deploy workflow's own
      # GITHUB_TOKEN. That only works once kolonie-infra has been granted read
      # access under the package's "Manage Actions access" — the same step the
      # api and verifier-runner images needed (kolonie-infra#1). Until then the
      # image builds and nothing deploys it.
      - name: Remind about package access
        run: |
          echo "::notice::Grant kolonie-infra read access under Manage Actions access on the kolonie-website package, and add --profile website to detect_profile() in kolonie-infra/scripts/deploy.sh."
