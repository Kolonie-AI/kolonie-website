name: Build image

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/kolonie-ai/kolonie-website

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The step that was missing here, and that kolonie-platform's workflows have
  # had since kolonie-infra#14. Pushing the image was the end of this workflow,
  # so the site rebuilt on every commit and production kept serving whatever had
  # last been deployed for some other reason. Found by shipping /academy, seeing
  # the image build green, and then reading a 404 off kolonie.ai/academy/.
  #
  # The comment this replaces named the two prerequisites — package read access
  # for kolonie-infra, and `--profile website` in `detect_profile()`. Both are
  # done, so what was left was nobody calling the deploy.
  #
  # `version: github.sha` rather than `latest` for the same reason the platform
  # workflows pass it: deploying `latest` ships whatever finished building most
  # recently, which need not be this commit. Naming the tag this job just pushed
  # makes what runs a function of a commit again.
  deploy:
    name: deploy ghcr.io/kolonie-ai/kolonie-website:${{ github.sha }} to the VPS
    needs: build
    uses: Kolonie-AI/kolonie-infra/.github/workflows/deploy.yml@main
    with:
      service: website
      version: ${{ github.sha }}
    # Named, not inherited: the called workflow declares exactly these two.
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    permissions:
      contents: read
      packages: read
